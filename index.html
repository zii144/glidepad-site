<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glidepad — your phone is the trackpad</title>
<meta name="description" content="Install Glidepad on your Mac or PC, scan one code with your phone, and use it as a trackpad, keyboard and remote. No account, no ads, no server.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%231c1c1e'/%3E%3Cg fill='%23fff' transform='translate(4 4)'%3E%3Ccircle cx='5' cy='26' r='2'/%3E%3Ccircle cx='10' cy='20.5' r='2.5'/%3E%3Ccircle cx='15.5' cy='15.5' r='3'/%3E%3Cpath d='M17 5v19l5.1-4.9 3.8 8 3.2-1.5-3.6-7.8H31z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preload" as="image" href="assets/screens/trackpad.jpg">
<script>document.documentElement.classList.add('js')</script>
<style>
  :root {
    --bg: #f6f6f7; --ink: #111113; --ink-2: #55555c; --ink-3: #8b8b92;
    --line: rgba(0,0,0,.1); --fill: rgba(0,0,0,.05); --accent: #111113; --on-accent: #fff;
    --blue: #0a84ff; --point: 60,60,67; --head: rgba(246,246,247,.72);
    --ease: cubic-bezier(.2,.7,.1,1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #08080a; --ink: #f4f4f5; --ink-2: #a8a8b0; --ink-3: #6f6f77;
      --line: rgba(255,255,255,.12); --fill: rgba(255,255,255,.07); --accent: #f4f4f5; --on-accent: #0b0b0c;
      --point: 235,235,245; --head: rgba(8,8,10,.7);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 72px; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); overflow-x: clip;
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang HK", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  h1, h2, h3 { margin: 0; letter-spacing: -.025em; text-wrap: balance; }
  p { margin: 0; text-wrap: pretty; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
  .kicker { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  h2 { font-size: clamp(34px, 5.4vw, 60px); line-height: 1.04; margin-top: 12px; }

  /* Header: transparent over the hero, frosted once you scroll */
  .top { position: fixed; inset: 0 0 auto; z-index: 20; transition: background .3s, box-shadow .3s; }
  .top.scrolled { background: var(--head); backdrop-filter: saturate(1.6) blur(18px); -webkit-backdrop-filter: saturate(1.6) blur(18px); box-shadow: 0 1px 0 var(--line); }
  .top .wrap { display: flex; align-items: center; gap: 28px; height: 60px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 18px; text-decoration: none; margin-right: auto; }
  .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
  .nav { display: flex; gap: 24px; font-size: 15px; }
  .nav a { text-decoration: none; color: var(--ink-2); transition: color .2s; }
  .nav a:hover { color: var(--ink); }
  .lang { display: flex; gap: 2px; font-size: 14px; }
  .lang button { border: 0; background: none; color: var(--ink-3); font: inherit; padding: 6px 8px; min-height: 36px; cursor: pointer; border-radius: 8px; }
  .lang button[aria-pressed="true"] { color: var(--ink); font-weight: 600; }

  .btn {
    display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 26px; border-radius: 999px;
    background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none; border: 0;
    transition: transform .2s var(--ease), opacity .2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .btn[aria-disabled="true"] { opacity: .4; pointer-events: none; }
  .link { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 600; text-decoration: none; color: var(--ink); }
  .link::after { content: "→"; transition: transform .2s var(--ease); }
  .link:hover::after { transform: translateX(4px); }

  /* Hero */
  .hero { position: relative; min-height: 100svh; display: grid; align-items: center; overflow: hidden; padding: 96px 0 40px; }
  #cloud { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hero-grid { position: relative; z-index: 1; display: grid; grid-template-columns: 1.1fr .9fr; gap: 48px; align-items: center; }
  .hero-copy { will-change: transform, opacity; }
  .hero h1 { margin-top: 18px; font-size: clamp(48px, 8.2vw, 104px); line-height: .98; font-weight: 750; letter-spacing: -.04em; }
  .hero h1 span { display: block; }
  .hero h1 span + span { color: var(--ink-3); }
  .lead { margin-top: 24px; font-size: clamp(18px, 1.6vw, 21px); color: var(--ink-2); max-width: 30em; }
  .cta { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; }
  .fine { margin-top: 16px; font-size: 14px; color: var(--ink-3); }
  .cue { position: absolute; left: 50%; bottom: 22px; z-index: 1; width: 24px; height: 38px; margin-left: -12px; border: 1.5px solid var(--ink-3); border-radius: 12px; opacity: .7; }
  .cue::after { content: ""; position: absolute; left: 50%; top: 8px; width: 3px; height: 7px; margin-left: -1.5px; border-radius: 2px; background: var(--ink-3); animation: cue 1.8s var(--ease) infinite; }
  @keyframes cue { 0% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(12px); opacity: 0; } 100% { opacity: 0; } }

  /* Phone: a device, not a card */
  .device { position: relative; width: min(300px, 64vw); aspect-ratio: 600 / 1304; border-radius: 15% / 7%; padding: 3.2%;
    background: linear-gradient(145deg, #3a3a3e, #0d0d0f 40%, #1f1f22); box-shadow: 0 50px 100px -30px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06) inset; }
  .device .screen { position: relative; width: 100%; height: 100%; border-radius: 12.5% / 5.8%; overflow: hidden; background: #000; }
  .device img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero .device { justify-self: center; transform-origin: 50% 100%; will-change: transform; }

  /* Feature story: a dark band with a pinned phone */
  .story { position: relative; background: #000; color: #f4f4f5; }
  .story::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(60% 40% at 72% 30%, rgba(10,132,255,.16), transparent 70%), radial-gradient(50% 35% at 20% 80%, rgba(191,90,242,.1), transparent 70%); }
  .story .kicker { color: #8e8e96; }
  .story-intro { position: relative; padding: 140px 0 40px; }
  .story-intro h2 { max-width: 13em; }
  .story-grid { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
  .chapters { list-style: none; margin: 0; padding: 0 0 18vh; }
  .chapter { min-height: 88vh; display: flex; flex-direction: column; justify-content: center; max-width: 30em;
    opacity: .22; transition: opacity .6s var(--ease); }
  .chapter.on { opacity: 1; }
  .chapter .kicker { display: flex; align-items: center; gap: 12px; }
  .chapter .kicker b { font-variant-numeric: tabular-nums; color: #f4f4f5; font-weight: 600; }
  .chapter h3 { font-size: clamp(30px, 3.6vw, 46px); line-height: 1.08; margin-top: 14px; }
  .chapter p:not(.kicker) { margin-top: 18px; font-size: 19px; color: #a8a8b0; }
  .chapter .inline { display: none; }
  .pin { position: sticky; top: 0; height: 100vh; display: grid; place-items: center; }
  .pin .device { width: min(320px, 26vw); }
  .pin img { opacity: 0; transform: scale(1.04); transition: opacity .7s var(--ease), transform .9s var(--ease); }
  .pin img.on { opacity: 1; transform: none; }
  .dots { position: absolute; right: 0; top: 50%; transform: translateY(-50%); display: grid; gap: 10px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.22); transition: background .3s, transform .3s; }
  .dots i.on { background: #fff; transform: scale(1.4); }

  /* Privacy statement: words light up as you scroll */
  .statement { height: 220vh; position: relative; }
  .statement .stick { position: sticky; top: 0; height: 100vh; display: grid; align-items: center; }
  .statement .kicker { margin-bottom: 26px; display: block; }
  .statement p { font-size: clamp(30px, 4.6vw, 58px); line-height: 1.16; font-weight: 650; letter-spacing: -.025em; max-width: 18em; }
  .statement .w { opacity: .14; transition: opacity .25s linear; }
  .statement .w.lit { opacity: 1; }

  /* Steps: big numerals on a line that fills as you scroll */
  .how { padding: 120px 0 80px; }
  .rail { position: relative; margin-top: 64px; height: 2px; background: var(--line); }
  .rail i { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(var(--p, 0)); background: var(--ink); }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 48px; }
  .steps li { padding-top: 28px; position: relative; }
  .steps li::before { content: ""; position: absolute; top: -7px; left: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--ink-3); transition: background .3s, border-color .3s; }
  .steps li.done::before { background: var(--ink); border-color: var(--ink); }
  .num { display: block; font-size: clamp(56px, 7vw, 88px); font-weight: 700; line-height: 1; letter-spacing: -.05em; color: var(--ink-3); opacity: .5; font-variant-numeric: tabular-nums; }
  .steps h3 { font-size: 22px; line-height: 1.25; margin-top: 18px; }
  .steps p { margin-top: 8px; color: var(--ink-2); }
  .stores { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 15px; }
  .stores a { text-decoration: none; font-weight: 600; min-height: 32px; display: inline-flex; align-items: center; }
  .stores a[aria-disabled="true"] { color: var(--ink-3); font-weight: 500; }

  /* Install */
  .install { padding: 80px 0; }
  .tabs { margin-top: 40px; display: flex; gap: 32px; border-bottom: 1px solid var(--line); }
  .tabs button { position: relative; border: 0; background: none; font: inherit; font-size: 19px; font-weight: 600; color: var(--ink-3); padding: 12px 0 16px; cursor: pointer; min-height: 44px; transition: color .2s; }
  .tabs button::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); transform: scaleX(0); transition: transform .35s var(--ease); }
  .tabs button[aria-selected="true"] { color: var(--ink); }
  .tabs button[aria-selected="true"]::after { transform: scaleX(1); }
  .panel { padding-top: 36px; display: grid; grid-template-columns: 1fr 280px; gap: 64px; align-items: start; animation: rise .5s var(--ease); }
  .panel[hidden] { display: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  .panel ol { margin: 0; padding: 0; list-style: none; counter-reset: k; }
  .panel li { counter-increment: k; position: relative; padding: 18px 0 18px 52px; border-top: 1px solid var(--line); color: var(--ink-2); }
  .panel li:first-child { border-top: 0; padding-top: 0; }
  .panel li::before { content: counter(k); position: absolute; left: 0; top: 16px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--ink); font-size: 14px; font-weight: 650; }
  .panel li:first-child::before { top: -2px; }
  .panel b, .panel .path { color: var(--ink); }
  .panel small { display: block; color: var(--ink-3); font-size: 14px; margin-top: 4px; }
  kbd, code { font: 14px ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--fill); border-radius: 6px; padding: 2px 6px; overflow-wrap: anywhere; }
  .side { display: grid; gap: 6px; position: sticky; top: 96px; }
  .side .btn { justify-content: center; }
  .side a.alt { font-size: 14px; color: var(--ink-2); text-align: center; text-underline-offset: 3px; min-height: 36px; display: grid; place-items: center; }
  .side a.alt[aria-disabled="true"] { opacity: .45; }
  .side .soon { font-size: 14px; color: var(--ink-3); text-align: center; }
  .side .soon[hidden] { display: none; }

  /* Help: an accordion on hairlines */
  .help { padding: 80px 0 120px; }
  .faq { margin-top: 40px; border-top: 1px solid var(--line); }
  .faq details { border-bottom: 1px solid var(--line); }
  .faq summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 24px 0; font-size: clamp(19px, 2vw, 23px); font-weight: 600; letter-spacing: -.01em; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: ""; flex: none; width: 12px; height: 12px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(45deg) translate(-3px, -3px); transition: transform .3s var(--ease); }
  .faq details[open] summary::after { transform: rotate(225deg); }
  .faq details p { padding: 0 48px 26px 0; color: var(--ink-2); max-width: 44em; }
  .faq details[open] p { animation: rise .4s var(--ease); }
  .more { margin-top: 28px; }

  footer { border-top: 1px solid var(--line); padding: 32px 0 48px; color: var(--ink-3); font-size: 14px; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 10px 28px; justify-content: space-between; }
  footer nav { display: flex; gap: 20px; }
  footer a { text-decoration: none; }
  footer a:hover { color: var(--ink); }

  /* Reveal on entering the viewport */
  .js .reveal { opacity: 0; transform: translateY(28px); transition: opacity .9s var(--ease), transform .9s var(--ease); transition-delay: var(--d, 0s); }
  .js .reveal.in { opacity: 1; transform: none; }

  @media (max-width: 900px) {
    .nav { display: none; }
    .hero { padding-top: 88px; min-height: auto; }
    .hero-grid { grid-template-columns: 1fr; gap: 48px; padding-bottom: 40px; }
    .hero .device { width: min(260px, 66vw); }
    .cue { display: none; }
    .story-intro { padding: 96px 0 8px; }
    .story-grid { grid-template-columns: 1fr; }
    .pin { display: none; }
    .chapters { padding-bottom: 72px; }
    .chapter { min-height: 0; opacity: 1; padding: 48px 0; max-width: none; }
    .chapter .inline { display: block; margin-top: 32px; width: min(240px, 62vw); }
    .statement { height: auto; }
    .statement .stick { position: static; height: auto; padding: 96px 0; }
    .how { padding: 72px 0 48px; }
    .rail { display: none; }
    .steps { grid-template-columns: 1fr; gap: 0; margin-top: 32px; }
    .steps li { padding: 28px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 64px 1fr; column-gap: 12px; align-content: start; }
    .steps li > :not(.num) { grid-column: 2; }
    .steps li::before { display: none; }
    .num { font-size: 44px; grid-row: 1 / span 3; }
    .steps h3 { margin-top: 2px; }
    .panel { grid-template-columns: 1fr; gap: 32px; }
    .side { position: static; order: -1; }
    .tabs { gap: 24px; }
    .faq details p { padding-right: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .js .reveal, .js .reveal.in { opacity: 1; transform: none; transition: none; }
    .chapter { opacity: 1; }
    .statement .w { opacity: 1; }
    .cue::after { animation: none; }
    .btn, .pin img, .panel, .faq details[open] p { transition: none; animation: none; }
  }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 6px; }
</style>
</head>
<body>

<header class="top" id="top">
  <div class="wrap">
    <a class="brand" href="#"><span class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 32 32" fill="currentColor"><circle cx="5" cy="26" r="2"/><circle cx="10" cy="20.5" r="2.5"/><circle cx="15.5" cy="15.5" r="3"/><path d="M17 5v19l5.1-4.9 3.8 8 3.2-1.5-3.6-7.8H31z"/></svg></span>Glidepad</a>
    <nav class="nav" aria-label="Sections">
      <a href="#features" data-i18n="navFeatures"></a>
      <a href="#install" data-i18n="navInstall"></a>
      <a href="#help" data-i18n="navHelp"></a>
      <a href="support/" data-i18n="footSupport"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="zh">中文</button>
    </div>
  </div>
</header>

<div class="hero">
  <canvas id="cloud" aria-hidden="true"></canvas>
  <div class="wrap hero-grid">
    <div class="hero-copy" id="hero-copy">
      <p class="kicker" data-i18n="eyebrow"></p>
      <h1><span data-i18n="title1"></span><span data-i18n="title2"></span></h1>
      <p class="lead" data-i18n="lead"></p>
      <div class="cta">
        <a class="btn" id="main-download" href="#install">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>
          <span id="main-download-label"></span>
        </a>
        <a class="link" href="#features" data-i18n="seeHow"></a>
      </div>
      <p class="fine" id="hero-fine"></p>
    </div>
    <div class="device" id="hero-device">
      <div class="screen"><img src="assets/screens/trackpad.jpg" width="598" height="1300" alt="" data-i18n-alt="shotAlt"></div>
    </div>
  </div>
  <a class="cue" href="#features" data-i18n-label="scroll"></a>
</div>

<main>
  <section class="story" id="features">
    <div class="wrap story-intro">
      <p class="kicker reveal" data-i18n="featKicker"></p>
      <h2 class="reveal" style="--d:.08s" data-i18n="featTitle"></h2>
    </div>
    <div class="wrap story-grid">
      <ol class="chapters">
        <li class="chapter"><p class="kicker"><b>01</b><span data-i18n="c1k"></span></p><h3 data-i18n="c1t"></h3><p data-i18n="c1b"></p><div class="device inline"><div class="screen"><img src="assets/screens/trackpad.jpg" alt="" loading="lazy" width="598" height="1300"></div></div></li>
        <li class="chapter"><p class="kicker"><b>02</b><span data-i18n="c2k"></span></p><h3 data-i18n="c2t"></h3><p data-i18n="c2b"></p><div class="device inline"><div class="screen"><img src="assets/screens/compose.jpg" alt="" loading="lazy" width="600" height="1304"></div></div></li>
        <li class="chapter"><p class="kicker"><b>03</b><span data-i18n="c3k"></span></p><h3 data-i18n="c3t"></h3><p data-i18n="c3b"></p><div class="device inline"><div class="screen"><img src="assets/screens/media.jpg" alt="" loading="lazy" width="600" height="1304"></div></div></li>
        <li class="chapter"><p class="kicker"><b>04</b><span data-i18n="c4k"></span></p><h3 data-i18n="c4t"></h3><p data-i18n="c4b"></p><div class="device inline"><div class="screen"><img src="assets/screens/present.jpg" alt="" loading="lazy" width="600" height="1304"></div></div></li>
        <li class="chapter"><p class="kicker"><b>05</b><span data-i18n="c5k"></span></p><h3 data-i18n="c5t"></h3><p data-i18n="c5b"></p><div class="device inline"><div class="screen"><img src="assets/screens/decks.jpg" alt="" loading="lazy" width="600" height="1304"></div></div></li>
      </ol>
      <div class="pin" aria-hidden="true">
        <div class="device">
          <div class="screen" id="shots">
            <img class="on" src="assets/screens/trackpad.jpg" alt="" width="598" height="1300">
            <img src="assets/screens/compose.jpg" alt="" width="600" height="1304">
            <img src="assets/screens/media.jpg" alt="" width="600" height="1304">
            <img src="assets/screens/present.jpg" alt="" width="600" height="1304">
            <img src="assets/screens/decks.jpg" alt="" width="600" height="1304">
          </div>
        </div>
        <div class="dots" id="dots"><i class="on"></i><i></i><i></i><i></i><i></i></div>
      </div>
    </div>
  </section>

  <section class="statement" id="statement">
    <div class="stick">
      <div class="wrap">
        <span class="kicker" data-i18n="privKicker"></span>
        <p id="statement-text"></p>
        <a class="link" style="margin-top:28px" href="privacy/" data-i18n="privLink"></a>
      </div>
    </div>
  </section>

  <section class="how" id="how">
    <div class="wrap">
      <p class="kicker reveal" data-i18n="howKicker"></p>
      <h2 class="reveal" style="--d:.08s" data-i18n="howTitle"></h2>
      <div class="rail" aria-hidden="true"><i id="rail"></i></div>
      <ol class="steps" id="steps">
        <li class="reveal"><span class="num" aria-hidden="true">01</span><h3 data-i18n="s1t"></h3><p data-i18n="s1b"></p></li>
        <li class="reveal" style="--d:.1s"><span class="num" aria-hidden="true">02</span><h3 data-i18n="s2t"></h3><p data-i18n="s2b"></p>
          <div class="stores"><a id="store-ios"></a><a id="store-android"></a></div>
        </li>
        <li class="reveal" style="--d:.2s"><span class="num" aria-hidden="true">03</span><h3 data-i18n="s3t"></h3><p data-i18n="s3b"></p></li>
      </ol>
    </div>
  </section>

  <section class="install" id="install">
    <div class="wrap">

// ── Which computer is this? ──────────────────────────────────────────────────────────────
function detect() {
  const ua = navigator.userAgent || '';
  const pf = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
  if (/Android/i.test(ua) || /iPhone|iPod/i.test(ua)) return 'phone';
  if (/iPad/i.test(ua) || (/Mac/i.test(pf) && navigator.maxTouchPoints > 1)) return 'phone';
  if (/Win/i.test(pf) || /Windows/i.test(ua)) return 'win';
  if (/Mac/i.test(pf) || /Macintosh/i.test(ua)) return 'mac';
  if (/Linux|X11/i.test(pf + ua)) return 'linux';
  return 'mac';
}
const device = detect();
const mainFile = { mac: 'mac', win: 'win', linux: 'deb' };
const ready = (file) => !!CONFIG.base && CONFIG.ready.includes(file);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const still = matchMedia('(prefers-reduced-motion: reduce)');
const narrow = matchMedia('(max-width: 900px)');

function store(pick) { try { return pick(localStorage); } catch (_) { return null; } }
let lang = store(s => s.getItem('glidepad-lang')) || (/^zh/i.test(navigator.language || '') ? 'zh' : 'en');

// The privacy statement is split into words (characters, for Chinese) that light up in turn.
function buildStatement(text) {
  const el = $('#statement-text');
  const parts = lang === 'zh' ? [...text] : text.split(/(\s+)/);
  el.innerHTML = parts.map(p => /^\s+$/.test(p) ? p : `<span class="w" aria-hidden="true">${p}</span>`).join('');
  el.setAttribute('aria-label', text);
  el.setAttribute('role', 'text');
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  $$('[data-i18n]').forEach(el => { el.innerHTML = t[el.dataset.i18n]; });
  $$('[data-i18n-alt]').forEach(el => { el.alt = t[el.dataset.i18nAlt]; });
  $$('[data-i18n-label]').forEach(el => { el.setAttribute('aria-label', t[el.dataset.i18nLabel]); });
  $$('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  $$('[data-file]').forEach(a => {
    const panelMain = a.closest('.side').querySelector('.btn[data-file]').dataset.file;
    if (ready(a.dataset.file) && ready(panelMain)) { a.href = CONFIG.base + FILES[a.dataset.file]; a.removeAttribute('aria-disabled'); a.removeAttribute('title'); }
    else {
      a.removeAttribute('href'); a.setAttribute('aria-disabled', 'true'); a.title = t.soon;
    }
  });

  const main = $('#main-download');
  if (device === 'phone') {
    $('#main-download-label').textContent = t.onPhone;
    main.href = '#install';
    $('#hero-fine').textContent = t.finePhone;
  } else if (ready(mainFile[device])) {
    $('#main-download-label').textContent = t.dlFor[device];
    main.href = CONFIG.base + FILES[mainFile[device]];
    $('#hero-fine').textContent = t.fine(device);
  } else {
    // Nothing to download yet: lead to the install guide rather than a dead button.
    $('#main-download-label').textContent = `${t.dlFor[device]} · ${t.soon}`;
    main.href = '#install';
    $('#hero-fine').textContent = t.fine(device);
  }

  for (const [id, name, url] of [['#store-ios', 'App Store', CONFIG.appStore], ['#store-android', 'Google Play', CONFIG.playStore]]) {
    const a = $(id);
    if (url) { a.textContent = name + ' →'; a.href = url; a.removeAttribute('aria-disabled'); }
    else { a.textContent = `${name} · ${t.soon}`; a.removeAttribute('href'); a.setAttribute('aria-disabled', 'true'); }
  }
  // A panel's note shows only while its main download isn't out yet.
  $$('.soon').forEach(el => { el.hidden = ready(el.parentElement.querySelector('.btn[data-file]').dataset.file); });
  $('#foot-version').textContent = t.footVersion;
  buildStatement(t.statement);
  onScroll();
}

$$('.lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  store(s => s.setItem('glidepad-lang', lang));
  render();
}));

function selectTab(os) {
  $$('.tabs button').forEach(b => {
    const on = b.dataset.os === os;
    b.setAttribute('aria-selected', String(on));
    b.tabIndex = on ? 0 : -1;
    $('#' + b.getAttribute('aria-controls')).hidden = !on;
  });
}
$$('.tabs button').forEach((b, i, all) => {
  b.addEventListener('click', () => selectTab(b.dataset.os));
  b.addEventListener('keydown', e => {
    const step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!step) return;
    const next = all[(i + step + all.length) % all.length];
    selectTab(next.dataset.os); next.focus();
  });
});

// ── Scroll-driven motion: one rAF-throttled handler, nothing runs while idle ─────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const header = $('#top'), heroCopy = $('#hero-copy'), heroDevice = $('#hero-device');
const chapters = $$('.chapter'), shots = $$('#shots img'), dots = $$('#dots i');
const statement = $('#statement'), how = $('#how'), rail = $('#rail'), steps = $$('#steps li');
let ticking = false, shown = -1;

function onScroll() {
  ticking = false;
  const y = scrollY, vh = innerHeight, calm = still.matches, small = narrow.matches;
  header.classList.toggle('scrolled', y > 8);

  // Hero: the copy drifts up and fades; the phone rises and tilts back as you leave.
  if (!calm && !small) {
    const p = clamp(y / vh);
    heroCopy.style.transform = `translateY(${(p * -60).toFixed(1)}px)`;
    heroCopy.style.opacity = String(clamp(1 - p * 1.2));
    heroDevice.style.transform = `translateY(${(p * -40).toFixed(1)}px) perspective(1200px) rotateX(${(p * 14).toFixed(2)}deg) scale(${(1 - p * .06).toFixed(4)})`;
  } else { heroCopy.style.transform = heroCopy.style.opacity = heroDevice.style.transform = ''; }

  // Feature story: the chapter crossing the middle of the screen picks the phone's screen.
  if (!small) {
    let active = 0;
    chapters.forEach((c, i) => { if (c.getBoundingClientRect().top < vh * .5) active = i; });
    chapters.forEach((c, i) => c.classList.toggle('on', i === active));
    if (active !== shown) {
      shown = active;
      shots.forEach((s, i) => s.classList.toggle('on', i === active));
      dots.forEach((d, i) => d.classList.toggle('on', i === active));
    }
  }

  // Privacy statement: words light up across the pinned stretch.
  const words = $$('#statement-text .w');
  if (calm || small) words.forEach(w => w.classList.add('lit'));
  else {
    const r = statement.getBoundingClientRect();
    const p = clamp(-r.top / (r.height - vh) * 1.15);
    const n = Math.round(p * words.length);
    words.forEach((w, i) => w.classList.toggle('lit', i < n));
  }

  // Steps: the rail fills as the section rises, and each dot turns on as the line reaches it.
  const r = how.getBoundingClientRect();
  const sp = calm ? 1 : clamp((vh * .85 - r.top) / (vh * .55));
  rail.style.setProperty('--p', sp.toFixed(3));
  steps.forEach((s, i) => s.classList.toggle('done', sp >= i / (steps.length - 1) - .001));
}
function requestTick() { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }
addEventListener('scroll', requestTick, { passive: true });
addEventListener('resize', requestTick);
still.addEventListener('change', requestTick);
narrow.addEventListener('change', requestTick);

// Reveal headings and blocks once, as they enter.
const io = 'IntersectionObserver' in window && new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
}, { rootMargin: '0px 0px -10% 0px' });
$$('.reveal').forEach(el => io ? io.observe(el) : el.classList.add('in'));

selectTab(device === 'phone' ? 'mac' : device);
render();

// ── Point-cloud terrain behind the hero: decorative, 20 fps, off when out of view ────────
(function cloud() {
  const canvas = $('#cloud'), ctx = canvas.getContext('2d');
  let w = 0, h = 0, rgb = '60,60,67', timer = null, t = 0, visible = true;

  function size() {
    const r = canvas.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
    w = r.width; h = r.height;
    canvas.width = Math.round(w * d); canvas.height = Math.round(h * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
    rgb = getComputedStyle(document.documentElement).getPropertyValue('--point').trim() || rgb;
    draw();
  }
  function height(x, z) {
    return Math.sin(x * 1.7 + t * .35) * .5 + Math.sin(z * 2.3 - t * .25) * .35 + Math.sin((x + z) * 3.1 + t * .18) * .25;
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    const horizon = h * .55, rows = 26, cols = w < 700 ? 44 : 84;
    for (let r = 0; r < rows; r++) {
      const depth = r / (rows - 1);
      const p = depth * depth;
      const y0 = horizon + p * (h - horizon) * 1.05;
      const spread = .55 + p * 1.5;
      const alpha = .06 + p * .26;
      const s = 1 + p * 1.4;
      ctx.fillStyle = `rgba(${rgb},${alpha.toFixed(3)})`;
      for (let c = 0; c < cols; c++) {
        const u = c / (cols - 1) - .5 + (r % 2 ? .5 / cols : 0);
        const x = w / 2 + u * w * spread;
        if (x < -4 || x > w + 4) continue;
        const y = y0 - height(u * 6, depth * 5) * (10 + p * 34);
        ctx.fillRect(x, y, s, s);
      }
    }
  }
  function run() {
    clearInterval(timer); timer = null;
    if (still.matches || document.hidden || !visible) return;
    timer = setInterval(() => { t += .05; draw(); }, 50);
  }
  if ('IntersectionObserver' in window) new IntersectionObserver(([e]) => { visible = e.isIntersecting; run(); }).observe(canvas);
  addEventListener('resize', size);
  document.addEventListener('visibilitychange', run);
  still.addEventListener('change', run);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', size);
  size(); run();
})();
</script>
