<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glidepad — your phone is the trackpad</title>
<meta name="description" content="Install Glidepad on your Mac or PC, scan one code with your phone, and use it as a trackpad, keyboard and remote. No account, no cloud.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%231c1c1e'/%3E%3Cg fill='%23fff' transform='translate(4 4)'%3E%3Ccircle cx='5' cy='26' r='2'/%3E%3Ccircle cx='10' cy='20.5' r='2.5'/%3E%3Ccircle cx='15.5' cy='15.5' r='3'/%3E%3Cpath d='M17 5v19l5.1-4.9 3.8 8 3.2-1.5-3.6-7.8H31z'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f5f6; --surface: #ffffff; --ink: #1c1c1e; --ink-2: #5d5d63; --ink-3: #8e8e93;
    --line: rgba(0,0,0,.09); --fill: rgba(0,0,0,.045); --accent: #1c1c1e; --on-accent: #ffffff;
    --point: 60,60,67; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0c; --surface: #17171a; --ink: #f4f4f5; --ink-2: #a9a9b0; --ink-3: #77777e;
      --line: rgba(255,255,255,.11); --fill: rgba(255,255,255,.07); --accent: #f4f4f5; --on-accent: #111113;
      --point: 235,235,245; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang HK", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  h1, h2, h3 { margin: 0; letter-spacing: -.02em; text-wrap: balance; }
  p { margin: 0; text-wrap: pretty; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }

  /* Header */
  header { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 18px 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 18px; text-decoration: none; }
  .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
  .lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
  .lang button { border: 0; background: none; color: var(--ink-2); font: inherit; font-size: 14px; padding: 5px 12px; border-radius: 999px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

  /* Hero */
  .hero { position: relative; overflow: hidden; }
  #cloud { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hero-grid { position: relative; z-index: 1; display: grid; grid-template-columns: 1.15fr .85fr; gap: 40px; align-items: center; padding: 20px 0 64px; }
  .eyebrow { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 14px; }
  h1 { font-size: clamp(38px, 6.2vw, 64px); line-height: 1.04; font-weight: 700; }
  .lead { margin-top: 18px; font-size: 19px; color: var(--ink-2); max-width: 30em; }
  .cta { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 24px; border-radius: 999px;
    background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none; border: 1px solid transparent;
    transition: transform .15s ease, opacity .15s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: scale(.98); }
  .btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
  .btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .fine { margin-top: 14px; font-size: 14px; color: var(--ink-3); }
  .fine a { text-underline-offset: 3px; }
  .phone { justify-self: center; width: min(250px, 62vw); border-radius: 40px; padding: 9px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .phone img { display: block; width: 100%; height: auto; border-radius: 32px; }
  .phone img.only-dark { display: none; }
  @media (prefers-color-scheme: dark) { .phone img.only-dark { display: block; } .phone img.only-light { display: none; } }

  /* Sections */
  section { padding: 64px 0; }
  .kicker { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  h2 { font-size: clamp(28px, 4vw, 38px); margin-top: 8px; line-height: 1.12; }
  .steps { margin-top: 32px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; counter-reset: s; list-style: none; padding: 0; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 24px; box-shadow: var(--shadow); }
  .steps li { counter-increment: s; }
  .steps li::before {
    content: counter(s); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
    background: var(--fill); font-weight: 650; font-variant-numeric: tabular-nums; margin-bottom: 16px;
  }
  .steps h3 { font-size: 19px; }
  .steps p { margin-top: 6px; color: var(--ink-2); font-size: 16px; }
  .stores { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  .stores .btn { min-height: 44px; padding: 0 16px; font-size: 15px; }

  /* Install guide */
  .tabs { margin-top: 28px; display: inline-flex; background: var(--fill); border-radius: 999px; padding: 4px; max-width: 100%; }
  .tabs button { border: 0; background: none; font: inherit; font-size: 15px; font-weight: 600; color: var(--ink-2); padding: 9px 20px; border-radius: 999px; cursor: pointer; min-height: 44px; }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .panel { margin-top: 16px; display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: start; }
  .panel[hidden] { display: none; }
  .panel ol { margin: 0; padding-left: 1.3em; display: grid; gap: 12px; }
  .panel li { padding-left: 4px; }
  .panel li::marker { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .panel small { display: block; color: var(--ink-3); font-size: 14px; margin-top: 2px; }
  kbd, code { font: 14px ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--fill); border-radius: 6px; padding: 2px 6px; overflow-wrap: anywhere; }
  .path { font-weight: 600; }
  .side { display: grid; gap: 10px; min-width: 220px; }
  .side .btn { justify-content: center; }
  .side a.alt { font-size: 14px; color: var(--ink-2); text-align: center; text-underline-offset: 3px; }

  /* Help */
  .help { margin-top: 28px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .help h3 { font-size: 18px; }
  .help p { margin-top: 6px; color: var(--ink-2); font-size: 16px; }

  footer { border-top: 1px solid var(--line); padding: 28px 0 44px; color: var(--ink-3); font-size: 14px; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }
  footer a { text-underline-offset: 3px; }

  @media (max-width: 820px) {
    .hero-grid { grid-template-columns: 1fr; padding: 16px 0 48px; gap: 32px; }
    .steps, .help { grid-template-columns: 1fr; }
    .panel { grid-template-columns: 1fr; }
    section { padding: 44px 0; }
    .tabs { display: flex; }
    .tabs button { flex: 1; padding: 9px 8px; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .btn { transition: none; } }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>

<div class="hero">
  <canvas id="cloud" aria-hidden="true"></canvas>
  <div class="wrap">
    <header>

</div>

<main>

        </div>
      </div>

  <section>

      </div>
    </div>
  </section>
</main>

<footer>

// ── Which computer is this? ──────────────────────────────────────────────────────────────
function detect() {
  const ua = navigator.userAgent || '';
  const pf = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
  if (/Android/i.test(ua) || /iPhone|iPod/i.test(ua)) return 'phone';
  if (/iPad/i.test(ua) || (/Mac/i.test(pf) && navigator.maxTouchPoints > 1)) return 'phone';
  if (/Win/i.test(pf) || /Windows/i.test(ua)) return 'win';
  if (/Mac/i.test(pf) || /Macintosh/i.test(ua)) return 'mac';
  if (/Linux|X11/i.test(pf + ua)) return 'linux';
  return 'mac';
}
const device = detect();
const mainFile = { mac: 'mac', win: 'win', linux: 'deb' };
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function store(pick) { try { return pick(localStorage); } catch (_) { return null; } }
let lang = store(s => s.getItem('glidepad-lang')) || (/^zh/i.test(navigator.language || '') ? 'zh' : 'en');

function render() {
  const t = T[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  $$('[data-i18n]').forEach(el => { el.innerHTML = t[el.dataset.i18n]; });
  $$('[data-i18n-alt]').forEach(el => { el.alt = t[el.dataset.i18nAlt]; });
  $$('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  $$('[data-file]').forEach(a => {
    if (CONFIG.base) { a.href = CONFIG.base + FILES[a.dataset.file]; a.removeAttribute('aria-disabled'); }
    else { a.removeAttribute('href'); a.setAttribute('aria-disabled', 'true'); a.title = t.soon; }
  });

  const main = $('#main-download');
  if (device === 'phone') {
    $('#main-download-label').textContent = t.onPhone;
    main.href = '#install';
    $('#hero-fine').textContent = t.finePhone;
  } else {
    $('#main-download-label').textContent = CONFIG.base ? t.dlFor[device] : `${t.dlFor[device]} · ${t.soon}`;
    if (CONFIG.base) { main.href = CONFIG.base + FILES[mainFile[device]]; main.removeAttribute('aria-disabled'); }
    else { main.removeAttribute('href'); main.setAttribute('aria-disabled', 'true'); }
    $('#hero-fine').textContent = t.fine(device);
  }

  for (const [id, name, url] of [['#store-ios', 'App Store', CONFIG.appStore], ['#store-android', 'Google Play', CONFIG.playStore]]) {
    const a = $(id);
    if (url) { a.textContent = name; a.href = url; a.removeAttribute('aria-disabled'); }
    else { a.textContent = `${name} · ${t.soon}`; a.removeAttribute('href'); a.setAttribute('aria-disabled', 'true'); }
  }
  $('#foot-version').textContent = t.footVersion;
}

$$('.lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  store(s => s.setItem('glidepad-lang', lang));
  render();
}));

function selectTab(os) {
  $$('.tabs button').forEach(b => {
    const on = b.dataset.os === os;
    b.setAttribute('aria-selected', String(on));
    b.tabIndex = on ? 0 : -1;
    $('#' + b.getAttribute('aria-controls')).hidden = !on;
  });
}
$$('.tabs button').forEach((b, i, all) => {
  b.addEventListener('click', () => selectTab(b.dataset.os));
  b.addEventListener('keydown', e => {
    const step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!step) return;
    const next = all[(i + step + all.length) % all.length];
    selectTab(next.dataset.os); next.focus();
  });
});
selectTab(device === 'phone' ? 'mac' : device);
render();

// ── Point-cloud terrain behind the hero: decorative, 20 fps, off when hidden ─────────────
(function cloud() {
  const canvas = $('#cloud'), ctx = canvas.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  let w = 0, h = 0, rgb = '60,60,67', timer = null, t = 0;

  function size() {
    const r = canvas.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
    w = r.width; h = r.height;
    canvas.width = Math.round(w * d); canvas.height = Math.round(h * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
    rgb = getComputedStyle(document.documentElement).getPropertyValue('--point').trim() || rgb;
    draw();
  }
  function height(x, z) {
    return Math.sin(x * 1.7 + t * .35) * .5 + Math.sin(z * 2.3 - t * .25) * .35 + Math.sin((x + z) * 3.1 + t * .18) * .25;
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    const horizon = h * .52, rows = 26, cols = w < 700 ? 44 : 84;
    for (let r = 0; r < rows; r++) {
      const depth = r / (rows - 1);              // 0 far … 1 near
      const p = depth * depth;
      const y0 = horizon + p * (h - horizon) * 1.05;
      const spread = .55 + p * 1.5;
      const alpha = .08 + p * .3;
      const s = 1 + p * 1.4;
      ctx.fillStyle = `rgba(${rgb},${alpha.toFixed(3)})`;
      for (let c = 0; c < cols; c++) {
        const u = c / (cols - 1) - .5 + (r % 2 ? .5 / cols : 0);
        const x = w / 2 + u * w * spread;
        if (x < -4 || x > w + 4) continue;
        const y = y0 - height(u * 6, depth * 5) * (10 + p * 34);
        ctx.fillRect(x, y, s, s);
      }
    }
  }
  function run() {
    clearInterval(timer); timer = null;
    if (still.matches || document.hidden) return;
    timer = setInterval(() => { t += .05; draw(); }, 50);
  }
  addEventListener('resize', size);
  document.addEventListener('visibilitychange', run);
  still.addEventListener('change', run);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', size);
  size(); run();
})();
</script>
